---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nc-config
data:
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD: nextcloud
  POSTGRES_DB: nextcloud
  POSTGRES_HOST: 100.122.42.74
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  NEXTCLOUD_ADMIN_USER: pl
  NEXTCLOUD_ADMIN_PASSWORD: nextcloud
  NEXTCLOUD_TRUSTED_DOMAINS: "nc.paradise-liberty.ts.net localhost"
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: ""
  TRUSTED_PROXIES: 100.73.219.12
  SMTP_HOST: ""
  SMTP_SECURE: ""
  SMTP_PORT: ""
  SMTP_AUTHTYPE: ""
  SMTP_NAME: ""
  SMTP_PASSWORD: ""
  MAIL_FROM_ADDRESS: ""
  MAIL_DOMAIN: ""
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nc
  name: nc
spec:
  containers:
    - name: nextcloud
      image: docker.io/library/nextcloud:29.0.16
      volumeMounts:
        - mountPath: /var/www/html
          name: nc-app
        - mountPath: /var/www/html/config
          name: nc-config
        - mountPath: /var/www/html/data
          name: nc-data
        - mountPath: /mnt/external
          name: nc-external
          readOnly: true
        - mountPath: /etc/localtime
          name: etc-localtime
          readOnly: true
      envFrom:
        - configMapRef:
            name: nc-config
            optional: false
      ports:
        - containerPort: 80
          hostPort: 8088

  restartPolicy: OnFailure

  volumes:
    - name: nc-app
      hostPath:
        path: /srv/nc/app
        type: Directory
    - name: nc-config
      hostPath:
        path: /srv/nc/config
        type: Directory
    - name:  nc-data
      hostPath:
        path: /srv/nc/data
        type: Directory
    - name: nc-external
      hostPath:
        path: /srv/nc/external
        type: Directory
    - name: etc-localtime
      hostPath:
        path: /etc/localtime
        type: File
